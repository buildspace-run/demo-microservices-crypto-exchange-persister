services:
  rabbitmq:
    image: 'rabbitmq:3-management-alpine'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672:5672'
      - '15672:15672'  # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      
  postgres:
    image: 'postgres:15-alpine'
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_DB=test'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=secret'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d test"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  rabbitmq-init:
    image: 'curlimages/curl:latest'
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=15672
      - RABBITMQ_USER=myuser
      - RABBITMQ_PASSWORD=secret
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-rabbitmq.sh"]
    restart: on-failure
